schema_version = 1

# Leica (houji) cameraserver 流桥接。基线 be5b8da9…（Flyme 12.6.0.0A 原厂）。
# 3 个检测点、RX 段与分支修正表由 wrion_leica_stream_v4 反汇编得到（WrionPatcher/.local/leica-reprocess-20261013）。
# 已在 device.toml 中默认启用：三处入口字不是被替换的原指令，stub 自行完成帧调整，需构建后核对；
# 引擎 append_rx_stub 写入的元数据 section 也使输出字节不同于 v4。整包结果仍待验证。
# 来源、哈希见 docs/whole-app-camera-20261015.md。

[plugin]
id = "flyme12.houji-leica-cameraserver"
version = "0.1.0"
engine = ">=0.1.0,<0.2.0"
description = "Leica 相机 cameraserver 流桥接（Xiaomi 14，ARM64 RX 段，待验证）"
enabled = true
order = 1422

[port]
mutable_partitions = ["system"]

[[steps]]
id = "patch-leica-cameraserver"

[[steps.actions]]
id = "wrion-leica-cameraserver"
op = "patch_elf_arm64"
path = "stage:system/system/bin/cameraserver"

[[steps.actions.patches]]
kind = "append_rx_stub"
id = "leica-stream-rx"
source_sha256 = "be5b8da94a33f5953704378305c7d32e581b5906be0caf66bb599d66df5b9b9b"
section = ".wrion_rx"
stub_hex = ""

