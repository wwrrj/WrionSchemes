# 由 WrionTools 的 WrionPatcher 页面生成；在页面里保存会覆盖这里的手工修改。
# 固定运行时与调用桩由 Builder 内置；方案实现经 ID 加密签发到 mi_ext。
# 每个目标包必须匹配已审阅基线；未授权时使用逐入口回退。
# APK 重签名后使用下方包名限定的 seapp 规则。

schema_version = 1

[plugin]
id = "flyme12.wrion-patcher-houji"
version = "0.1.0"
engine = ">=0.1.0,<0.2.0"
description = "WrionPatcher 授权修补（Xiaomi 14）"
enabled = true
order = 1410

[port]
mutable_partitions = ["system", "system_ext"]

[art]
manifest = "common/art/houji/manifest.json"

[[steps]]
id = "patch-authorized-framework"

[[steps.actions]]
id = "wrion-authorized-framework"
op = "wrion_patch"
path = "stage:system/system/framework/framework.jar"
scope = "framework"
profile = "patches/authorized/framework/points.json"
plans = ["framework.xiaomi_app_compat", "framework.xiaomi_account_telephony_fallback", "framework.xiaomi_account_device_name", "framework.finddevice_window_transport", "framework.tsm_native_nfc_adapter", "framework.tsm_self_package_order", "framework.tsm_native_vaid", "framework.tsm_foreground_nfc"]

[[steps]]
id = "patch-authorized-services"

[[steps.actions]]
id = "wrion-authorized-services"
op = "wrion_patch"
path = "stage:system/system/framework/services.jar"
scope = "services"
profile = "patches/authorized/services/points.json"
source_dex = "asset:common/wrion-patcher/service-flyme.dex"
plans = ["services.fingerprint_lifecycle", "services.face_camera_ownership", "services.flyme_color_mode", "services.flyme_wireless_reverse_charging", "services.xiaomi_tsm_shared_uid", "services.xiaomi_account_library", "services.finddevice_window", "services.xiaomi_cloud_builtin_dependency", "services.tsm_account_visibility", "services.tsm_native_token_cache", "services.gesture.fod_touch_arming", "services.gesture.double_tap_to_wake"]

[[steps]]
id = "patch-authorized-telephony-meizu"

[[steps.actions]]
id = "wrion-authorized-telephony-meizu"
op = "wrion_patch"
path = "stage:system/system/framework/meizu-telephony-common.jar"
scope = "telephony-meizu"
profile = "patches/authorized/telephony-meizu/points.json"
plans = ["flyme.ril.meizu_telephony"]

[[steps]]
id = "patch-authorized-telephony-qti"

[[steps.actions]]
id = "wrion-authorized-telephony-qti"
op = "wrion_patch"
path = "stage:system_ext/framework/qti-telephony-common.jar"
scope = "telephony-qti"
profile = "patches/authorized/telephony-qti/points.json"
plans = ["flyme.ril.qti_telephony"]

[[steps]]
id = "patch-authorized-settings"

[[steps.actions]]
id = "wrion-authorized-settings"
op = "wrion_patch"
path = "stage:system_ext/priv-app/Settings/Settings.apk"
scope = "settings"
profile = "patches/authorized/settings/points.json"
plans = ["settings.brightness_slider", "settings.flyme_color_page", "settings.enrollment_progress", "settings.ui_progress", "settings.raise_to_wake", "settings.face_preview_surface"]

[[steps]]
id = "patch-authorized-systemui"

[[steps.actions]]
id = "wrion-authorized-systemui"
op = "wrion_patch"
path = "stage:system_ext/priv-app/SystemUI/SystemUI.apk"
scope = "systemui"
profile = "patches/authorized/systemui/points.json"
plans = ["systemui.flyme_aod_panel_bridge", "systemui.brightness_curve", "systemui.flyme_optical_fp_and_mback"]

[[steps]]
id = "drop-stale-preopt"
needs = ["patch-authorized-framework", "patch-authorized-services", "patch-authorized-telephony-meizu", "patch-authorized-telephony-qti", "patch-authorized-settings", "patch-authorized-systemui"]

[[steps.actions]]
id = "drop-meizu-telephony-common-jar-preopt-0"
op = "delete"
path = "stage:system/system/framework/oat/arm64/meizu-telephony-common.odex"
on_missing = "skip"

[[steps.actions]]
id = "drop-meizu-telephony-common-jar-preopt-1"
op = "delete"
path = "stage:system/system/framework/oat/arm64/meizu-telephony-common.odex.fsv_meta"
on_missing = "skip"

[[steps.actions]]
id = "drop-meizu-telephony-common-jar-preopt-2"
op = "delete"
path = "stage:system/system/framework/oat/arm64/meizu-telephony-common.vdex"
on_missing = "skip"

[[steps.actions]]
id = "drop-meizu-telephony-common-jar-preopt-3"
op = "delete"
path = "stage:system/system/framework/oat/arm64/meizu-telephony-common.vdex.fsv_meta"
on_missing = "skip"

[[steps.actions]]
id = "drop-meizu-telephony-common-jar-preopt-4"
op = "delete"
path = "stage:system/system/framework/oat/arm64/meizu-telephony-common.art"
on_missing = "skip"

[[steps.actions]]
id = "drop-meizu-telephony-common-jar-preopt-5"
op = "delete"
path = "stage:system/system/framework/oat/arm64/meizu-telephony-common.art.fsv_meta"
on_missing = "skip"

[[steps.actions]]
id = "drop-qti-telephony-common-jar-preopt-0"
op = "delete"
path = "stage:system_ext/framework/oat/arm64/qti-telephony-common.odex"
on_missing = "skip"

[[steps.actions]]
id = "drop-qti-telephony-common-jar-preopt-1"
op = "delete"
path = "stage:system_ext/framework/oat/arm64/qti-telephony-common.odex.fsv_meta"
on_missing = "skip"

[[steps.actions]]
id = "drop-qti-telephony-common-jar-preopt-2"
op = "delete"
path = "stage:system_ext/framework/oat/arm64/qti-telephony-common.vdex"
on_missing = "skip"

[[steps.actions]]
id = "drop-qti-telephony-common-jar-preopt-3"
op = "delete"
path = "stage:system_ext/framework/oat/arm64/qti-telephony-common.vdex.fsv_meta"
on_missing = "skip"

[[steps.actions]]
id = "drop-qti-telephony-common-jar-preopt-4"
op = "delete"
path = "stage:system_ext/framework/oat/arm64/qti-telephony-common.art"
on_missing = "skip"

[[steps.actions]]
id = "drop-qti-telephony-common-jar-preopt-5"
op = "delete"
path = "stage:system_ext/framework/oat/arm64/qti-telephony-common.art.fsv_meta"
on_missing = "skip"

[[steps.actions]]
id = "drop-settings-apk-preopt-0"
op = "delete_tree"
path = "stage:system_ext/priv-app/Settings/oat"
on_missing = "skip"

[[steps.actions]]
id = "drop-systemui-apk-preopt-0"
op = "delete_tree"
path = "stage:system_ext/priv-app/SystemUI/oat"
on_missing = "skip"

# Package-scoped rules that give the re-signed packages the app domains
# their platform-signed baseline rules give them.
[[steps]]
id = "default-signer-seapp-contexts"

[[steps.actions]]
id = "seapp-default-signer-0"
op = "replace_text"
path = "stage:system/system/etc/selinux/plat_seapp_contexts"
find = """
user=system seinfo=platform domain=system_app type=system_app_data_file
"""
replace = """
user=system seinfo=default isPrivApp=true name=com.android.settings domain=system_app type=system_app_data_file
user=system seinfo=platform domain=system_app type=system_app_data_file
"""
expected_matches = 1

[[steps.actions]]
id = "seapp-default-signer-1"
op = "replace_text"
path = "stage:system/system/etc/selinux/plat_seapp_contexts"
find = """
user=_app seinfo=platform domain=platform_app type=app_data_file levelFrom=user
"""
replace = """
user=_app seinfo=default isPrivApp=true name=com.android.systemui domain=platform_app type=app_data_file levelFrom=user
user=_app seinfo=default isPrivApp=true name=com.meizu.media.camera domain=platform_app type=app_data_file levelFrom=user
user=_app seinfo=platform domain=platform_app type=app_data_file levelFrom=user
"""
expected_matches = 1
