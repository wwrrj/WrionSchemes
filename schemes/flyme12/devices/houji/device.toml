schema_version = 1

[device]
codename = "houji"
display_name = "Xiaomi 14"
aliases = ["houjiin"]
description = "Xiaomi 14 (houji / houjiin)"
author = "wwrrj"

[plugins]
enabled = [
  "flyme12.cleanup",
  "flyme12.wrion-patcher-houji",
]
disabled = []

[flash]
minimum_super_bytes = 17179869184
active_slot = "a"
unmap_partitions = ["system", "system_ext", "product"]
include_flash_tool = true
enable_root_menu = false
flash_crc_lists = false

[flash.expansion]
enabled = true
target_bytes = 17179869184
disk = "/dev/block/sda"
super_part = 32
userdata_part = 33
backup_dir = "backup"
sgdisk_dir = "tools/sgdisk-arm64"
confirm_word = "EXPAND"
restore_confirm_word = "RESTORE"

[[flash.images]]
file = "firmware/abl.elf"
partitions = ["abl_a", "abl_b"]

